<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Balatro GBA Demake</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
        }
        #emulator {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="emulator"></div>
    </div>

    <script>
        EJS_player = '#emulator';
        EJS_core = 'gba'; 
        EJS_gameName = "Balatro GBA";
        
        // Ensure your uploaded rom file is named EXACTLY this:
        EJS_gameUrl = 'balatro.gba'; 
        
        // FIX: Using the official standalone stable CDN endpoint
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    </script>
    
    <!-- FIX: Loading the script directly from the official stable endpoint -->
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>

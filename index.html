
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Library</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: #10131b; color: #f4f6fb;
    font-family: system-ui, Arial, sans-serif;
  }
  header { max-width: 1100px; margin: auto; }
  h1 { margin-bottom: 8px; }
  p { color: #aab3c5; }
  #search {
    width: 100%; padding: 14px; margin: 18px 0;
    border: 1px solid #394357; border-radius: 10px;
    background: #191e2a; color: white; font-size: 16px;
  }
  #status { margin: 12px 0; color: #aab3c5; }
  #games {
    max-width: 1100px; margin: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }
  .game {
    display: block; padding: 16px;
    border: 1px solid #30394b; border-radius: 12px;
    background: #191e2a; color: #f4f6fb;
    text-decoration: none; overflow-wrap: anywhere;
  }
  .game:hover { border-color: #83b7ff; background: #222c40; }
  .game small { display: block; margin-top: 6px; color: #aab3c5; }
  footer { max-width: 1100px; margin: 28px auto; color: #aab3c5; }
</style>
</head>
<body>
<header>
  <h1>Game Library</h1>
  <p>Browse all games in this repository.</p>
  <input id="search" type="search" placeholder="Search games..." aria-label="Search games">
  <div id="status">Finding game folders...</div>
</header>

<main id="games"></main>
<footer>Game folders are loaded automatically from this repository.</footer>

<script>
const OWNER = "Crowvicks";
const REPO = "GameList.github.io";
const BRANCH = "main";

const BASE = `/${REPO}/`;
const gamesElement = document.getElementById("games");
const statusElement = document.getElementById("status");
const searchElement = document.getElementById("search");
let games = [];

function displayName(path) {
  return path.split("/").pop()
    .replace(/[-_]+/g, " ")
    .replace(/\b\w/g, letter => letter.toUpperCase());
}

function renderGames() {
  const query = searchElement.value.trim().toLowerCase();
  const filtered = games.filter(game =>
    game.name.toLowerCase().includes(query) ||
    game.path.toLowerCase().includes(query)
  );

  gamesElement.replaceChildren();

  for (const game of filtered) {
    const link = document.createElement("a");
    link.className = "game";

    const folderURL = game.path
      .split("/")
      .map(encodeURIComponent)
      .join("/");

    link.href = BASE + folderURL + "/";
    const name = document.createElement("strong");
    name.textContent = game.name;

    const folder = document.createElement("small");
    folder.textContent = game.path;

    link.append(name, folder);
    gamesElement.append(link);
  }

  if (!filtered.length) {
    statusElement.textContent = games.length
      ? "No games match your search."
      : "No game folders found.";
  } else {
    statusElement.textContent =
      `Showing ${filtered.length} of ${games.length} games`;
  }
}

async function loadGames() {
  statusElement.textContent = "Loading repository folders...";
  try {
    const apiURL =
      `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;

    const response = await fetch(apiURL, {
      headers: { Accept: "application/vnd.github+json" }
    });

    if (!response.ok) {
      throw new Error(
        `GitHub returned ${response.status}. Check the repository and branch.`
      );
    }

    const data = await response.json();
    const folders = new Set();

    for (const item of data.tree || []) {
      if (
        item.type === "blob" &&
        item.path.toLowerCase().endsWith("/index.html")
      ) {
        // Get the folder containing this index.html.
        const folder = item.path.slice(0, -"/index.html".length);

        // Exclude the root homepage itself.
        if (folder) folders.add(folder);
      }
    }

    games = [...folders]
      .sort((a, b) => a.localeCompare(b))
      .map(path => ({ path, name: displayName(path) }));

    renderGames();

    if (data.truncated) {
      statusElement.textContent +=
        " (GitHub returned a partial file list for this large repository.)";
    }
  } catch (error) {
    statusElement.textContent =
      error.message + " Try refreshing the page later.";
  }
}

searchElement.addEventListener("input", renderGames);
loadGames();
</script>
</body>
</html>

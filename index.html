<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Game Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #00ffcc;
            margin-bottom: 30px;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .game-card {
            background-color: #2a2a2a;
            border: 2px solid #333;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }
        .game-title {
            background-color: #111;
            padding: 12px;
            font-weight: bold;
            font-size: 1.1em;
            border-bottom: 2px solid #333;
            color: #00ffcc;
            text-align: center;
        }
        .iframe-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #000;
        }
        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>Web Arcade Dashboard</h1>

    <div class="game-grid">

        <!-- GAME 1: 248 Puzzle -->
        <div class="game-card">
            <div class="game-title">2048 Puzzle</div>
            <div class="iframe-container">
                <iframe src="https://github.io" allowfullscreen></iframe>
            </div>
        </div>

        <!-- GAME 2: Hextris -->
        <div class="game-card">
            <div class="game-title">Hextris</div>
            <div class="iframe-container">
                <iframe src="https://hextris.io" allowfullscreen></iframe>
            </div>
        </div>

        <!-- GAME 3: Cloned Balatro (Relative Internal Path) -->
        <div class="game-card">
            <div class="game-title">Balatro Web Client</div>
            <div class="iframe-container">
                <!-- Points directly to your own folder inside the same repository -->
                <iframe src="./balatro-folder/index.html" allowfullscreen></iframe>
            </div>
        </div>

        <!-- GAME 4: Cloned GBA Emulator Context -->
        <div class="game-card">
            <div class="game-title">Retro Game Engine</div>
            <div class="iframe-container">
                <!-- Points directly to your EmulatorJS html setup -->
                <iframe src="./gba-emulator.html" allowfullscreen></iframe>
            </div>
        </div>

    </div>

</body>
</html>
